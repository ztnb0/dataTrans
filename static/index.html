<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据迁移工具</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "Microsoft YaHei", sans-serif; background: #f4f6f9; color: #333; }
header { background: #2b6cb0; color: #fff; padding: 14px 24px; font-size: 18px; font-weight: 600; }
.wrap { display: flex; gap: 16px; padding: 16px 24px; align-items: stretch; }
.panel { background: #fff; border-radius: 8px; padding: 16px; flex: 1; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.panel h2 { font-size: 15px; margin-bottom: 12px; color: #2b6cb0; border-bottom: 1px solid #eee; padding-bottom: 8px; }
select, input[type=text], input[type=number], input[type=date], input[type=month] { width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
label { display: block; font-size: 12px; color: #666; margin-bottom: 4px; }
.field-list { border: 1px solid #e2e8f0; border-radius: 4px; max-height: 300px; overflow-y: auto; }
.field-item { display: flex; align-items: center; padding: 6px 10px; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
.field-item:last-child { border-bottom: none; }
.field-item input[type=checkbox] { margin-right: 8px; }
.field-item .fname { font-weight: 600; }
.field-item .fmeta { color: #999; font-size: 11px; margin-left: 8px; }
.center { flex: 0 0 280px; display: flex; flex-direction: column; gap: 12px; }
.center .panel { flex: none; }
.mapping { font-size: 12px; }
.map-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.map-row select { margin-bottom: 0; flex: 1; }
.map-row .transform-sel { flex: 0 0 108px; }
.map-row .arrow { color: #2b6cb0; flex: 0 0 auto; }
.btn { background: #2b6cb0; color: #fff; border: none; padding: 10px 16px; border-radius: 4px; cursor: pointer; font-size: 14px; }
.btn:hover { background: #2c5282; }
.btn.gray { background: #718096; }
.btn.green { background: #2f855a; }
.btn.green:hover { background: #276749; }
.btn.red { background: #c53030; }
.btn:disabled { background: #a0aec0; cursor: not-allowed; }
.log { background: #1a202c; color: #a0aec0; padding: 12px; border-radius: 6px; font-size: 12px; min-height: 100px; max-height: 200px; overflow-y: auto; white-space: pre-wrap; font-family: monospace; }
.progress { height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; margin-top: 8px; display: none; }
.progress .bar { height: 100%; background: #48bb78; width: 0; transition: width .3s; }
.preview table { border-collapse: collapse; width: 100%; font-size: 12px; }
.preview th, .preview td { border: 1px solid #e2e8f0; padding: 4px 8px; text-align: left; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.preview th { background: #f7fafc; }
.hint { font-size: 12px; color: #888; margin-bottom: 8px; line-height: 1.5; }
.summary { font-size: 13px; padding: 8px 10px; background: #ebf8ff; border-radius: 4px; margin-bottom: 10px; line-height: 1.7; }
.summary b { color: #2b6cb0; }
.pager { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 13px; }
.pager button { padding: 4px 12px; border: 1px solid #ccc; background: #fff; border-radius: 4px; cursor: pointer; }
.pager button:disabled { color: #ccc; cursor: not-allowed; }
.two-col { display: flex; gap: 8px; }
.two-col > div { flex: 1; }
.preview-scroll { max-height: 480px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 4px; }
.preview-scroll table { width: 100%; }
.preview-scroll th { position: sticky; top: 0; }
.checkbox-cell { width: 30px; text-align: center; }
.search-box { position: relative; }
.search-box input { margin-bottom: 0; }
.search-drop { display: none; position: absolute; left: 0; right: 0; top: 100%; max-height: 240px; overflow-y: auto; background: #fff; border: 1px solid #ccc; border-radius: 4px; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
.search-drop .opt { padding: 7px 10px; font-size: 13px; cursor: pointer; }
.search-drop .opt:hover { background: #ebf4ff; }
.search-drop .opt.hl { background: #2b6cb0; color: #fff; }
.search-drop .empty { padding: 7px 10px; font-size: 12px; color: #999; }
.label-row { display: flex; align-items: center; justify-content: space-between; }
.label-row label { margin-bottom: 0; }
.btn.mini { padding: 4px 10px; font-size: 12px; }
.modal-mask { display: flex; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 1000; align-items: center; justify-content: center; }
.modal { background: #fff; border-radius: 8px; width: 440px; max-width: 92vw; padding: 20px; box-shadow: 0 8px 30px rgba(0,0,0,.2); }
.modal h2 { font-size: 16px; color: #2b6cb0; margin-bottom: 14px; }
.modal .row { margin-bottom: 10px; }
.modal .row.two { display: flex; gap: 8px; }
.modal .row.two > div { flex: 1; }
.modal label { display: block; font-size: 12px; color: #666; margin-bottom: 4px; }
.modal input, .modal select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
.modal .msg { font-size: 12px; min-height: 16px; margin-top: 8px; }
.modal .msg.ok { color: #2f855a; }
.modal .msg.err { color: #c53030; }
.opt { display: flex; align-items: center; justify-content: space-between; }
.opt .del { color: #c53030; font-weight: 700; padding: 0 6px; border-radius: 3px; }
.opt .del:hover { background: #fed7d7; }
</style>
</head>
<body>
<header>数据迁移工具 — 后台数据库 → 简道云</header>
<div class="wrap">
  <!-- 左栏：数据库 -->
  <div class="panel">
    <h2>① 后台数据库（左）</h2>
    <div class="label-row">
      <label>数据源</label>
      <div>
        <button class="btn mini" onclick="openAddSource()">+ 添加数据源</button>
        <button class="btn mini" onclick="openSourceManager()">数据源管理</button>
      </div>
    </div>
    <div class="search-box">
      <input type="text" id="source" placeholder="搜索或选择数据源…" autocomplete="off" oninput="filterSource()" onfocus="filterSource()">
      <div class="search-drop" id="sourceDrop"></div>
    </div>
    <label>数据库</label>
    <div class="search-box">
      <input type="text" id="db" placeholder="搜索或选择数据库…" autocomplete="off" oninput="filterDb()" onfocus="filterDb()">
      <div class="search-drop" id="dbDrop"></div>
    </div>
    <label>表</label>
    <div class="search-box">
      <input type="text" id="table" placeholder="搜索或选择表…" autocomplete="off" oninput="filterTable()" onfocus="filterTable()">
      <div class="search-drop" id="tableDrop"></div>
    </div>
    <label>选择要传输的字段（勾选）</label>
    <div class="field-list" id="dbFields"></div>

    <div style="margin-top:12px;display:flex;gap:6px;flex-wrap:wrap;">
      <button class="btn gray" onclick="previewData()">预览源数据</button>
      <button class="btn" id="btnAutoSingle" onclick="toggleAutoSync('single')">单源同步</button>
      <button class="btn" id="btnAutoAll" onclick="toggleAutoSync('all')">全部同步</button>
      <button class="btn gray" onclick="resetSyncState()">重置同步</button>
    </div>
  </div>

  <!-- 中栏：映射 + 操作 -->
  <div class="center">
    <div class="panel">
      <h2>② 字段映射</h2>
      <div class="hint">左侧勾选的字段自动与简道云字段配对，可手动调整右侧对应字段。</div>
      <div id="mappingList" class="mapping"></div>
      <button class="btn gray" style="margin-top:10px;width:100%;" onclick="saveMapping()">保存映射（供即时同步使用）</button>
      <button class="btn gray" style="margin-top:6px;width:100%;" onclick="openMappingManager()">映射管理</button>
      <div id="timeFilterBox" style="display:none;margin-top:12px;border-top:1px solid #eee;padding-top:10px;">
        <div class="hint" style="margin-bottom:6px;">时间字段 <b id="timeFieldName"></b>：作为筛选条件，并作为“平台数据创建时间”的来源。</div>
        <label>起始时间（不选日=按月初，不选月=按年初）</label>
        <div id="dateFromRow"></div>
      </div>
    </div>
    <div class="panel">
      <h2>③ 平台 & 传输</h2>
      <label>“平台”字段固定值（手写）</label>
      <input type="text" id="platformValue" placeholder="如：金库网班级">
      <label>“数据类型”字段固定值（手写）</label>
      <input type="text" id="dataTypeValue" placeholder="如：手动录入">
      <button class="btn gray" style="margin-top:4px;width:100%;" onclick="openRuleManager()">规则管理（平台/数据类型自动填充）</button>
      <label>限制条数（0 = 全部）</label>
      <input type="number" id="limitNum" value="0" min="0">
      <button class="btn green" id="btnTransfer" onclick="previewTransfer()">开始传输（先预览）</button>
      <div class="progress" id="progress"><div class="bar" id="progressBar"></div></div>
      <div class="log" id="log">就绪</div>
    </div>
  </div>

  <!-- 右栏：简道云 -->
  <div class="panel">
    <h2>④ 简道云表单（右）</h2>
    <div class="hint">应用 <b id="jdyAppId"></b></div>
    <div class="field-list" id="jdyFields" style="max-height:160px;"></div>
    <div style="margin-top:10px;">
      <button class="btn gray" onclick="loadJdyFields()">刷新字段</button>
      <button class="btn gray" onclick="viewJdyData()">查看表单已有数据</button>
    </div>
    <div id="jdyResult" style="margin-top:14px;"></div>
  </div>
</div>

<div class="panel" style="margin:0 24px 24px;">
  <h2>源数据预览</h2>
  <div class="preview" id="previewBox"><div class="hint">点击“预览源数据”查看源表前 5 条。</div></div>
</div>

<div class="panel" id="syncLogPanel" style="margin:0 24px 24px;">
  <h2>⑤ 同步日志（sync.log）
    <span id="syncLogBadge" style="display:none;background:#c53030;color:#fff;font-size:11px;padding:1px 8px;border-radius:10px;margin-left:8px;vertical-align:middle;">有新变更</span>
    <button class="btn mini" id="syncLogAck" onclick="ackSyncLogAlert()" style="display:none;margin-left:6px;">知道了</button>
    <span style="float:right;font-weight:400;">
      <label style="display:inline-block;font-size:12px;color:#666;margin-right:10px;">
        <input type="checkbox" id="syncLogAuto" checked onchange="toggleSyncLogAuto()" style="width:auto;margin:0 4px 0 0;vertical-align:middle;">自动刷新(5s)
      </label>
      <label style="display:inline-block;font-size:12px;color:#666;margin-right:10px;">
        <input type="checkbox" id="syncLogHideIdle" checked onchange="renderSyncLog()" style="width:auto;margin:0 4px 0 0;vertical-align:middle;">隐藏空闲
      </label>
      <button class="btn mini" onclick="loadSyncLog()">刷新</button>
    </span>
  </h2>
  <div id="syncLogSummary" class="summary">加载中…</div>
  <div id="syncLogList" class="preview-scroll" style="max-height:360px;"></div>
  <details style="margin-top:10px;">
    <summary style="cursor:pointer;font-size:12px;color:#666;">查看原始日志</summary>
    <div class="log" id="syncLogRaw" style="margin-top:8px;max-height:260px;">…</div>
  </details>
</div>

<div class="modal-mask" id="sourceModal" style="display:none;" onclick="if(event.target===this)closeAddSource()">
  <div class="modal">
    <h2>添加数据源</h2>
    <div class="row">
      <label>类型</label>
      <select id="srcType" onchange="toggleSourceForm()">
        <option value="mysql">MySQL</option>
        <option value="oracle">Oracle</option>
      </select>
    </div>
    <div class="row">
      <label>名称</label>
      <input type="text" id="srcName" placeholder="如：182测试数据库">
    </div>
    <div class="row two">
      <div><label>主机</label><input type="text" id="srcHost" placeholder="如：192.168.2.182"></div>
      <div><label>端口</label><input type="number" id="srcPort" value="3306"></div>
    </div>
    <div class="row two">
      <div><label>用户名</label><input type="text" id="srcUser"></div>
      <div><label>密码</label><input type="password" id="srcPassword"></div>
    </div>
    <div class="row" id="srcCharsetRow">
      <label>字符集</label>
      <input type="text" id="srcCharset" value="gbk">
    </div>
    <div id="oracleFields" style="display:none;">
      <div class="row"><label>服务名（service）</label><input type="text" id="srcService" placeholder="如：ORCL"></div>
      <div class="row"><label>Schema 列表（逗号分隔，可留空）</label><input type="text" id="srcSchemas" placeholder="如：BFEC,SHFEC,GZFEC"></div>
      <div class="row"><label>Instant Client 路径</label><input type="text" id="srcInstantClient" placeholder="如：D:/.../instantclient_21_15"></div>
    </div>
    <div class="msg" id="srcMsg"></div>
    <div class="modal-actions">
      <button class="btn gray" onclick="testSource()">测试连接</button>
      <button class="btn green" onclick="saveSource()">保存</button>
      <button class="btn gray" onclick="closeAddSource()">取消</button>
    </div>
  </div>
</div>

<div class="modal-mask" id="mgrModal" style="display:none;" onclick="if(event.target===this)closeSourceManager()">
  <div class="modal">
    <h2>数据源管理</h2>
    <div id="mgrList"></div>
    <div class="modal-actions">
      <button class="btn gray" onclick="closeSourceManager()">关闭</button>
    </div>
  </div>
</div>

<div class="modal-mask" id="mappingMgrModal" style="display:none;" onclick="if(event.target===this)closeMappingManager()">
  <div class="modal" style="width:640px;">
    <h2>映射管理</h2>
    <div id="mappingMgrList"></div>
    <div class="modal-actions">
      <button class="btn gray" onclick="closeMappingManager()">关闭</button>
    </div>
  </div>
</div>

<div class="modal-mask" id="ruleMgrModal" style="display:none;" onclick="if(event.target===this)closeRuleManager()">
  <div class="modal" style="width:640px;">
    <h2>规则管理（平台 / 数据类型自动填充）</h2>
    <div id="ruleMgrList"></div>
    <div class="modal-actions">
      <button class="btn green" onclick="saveRules()">保存规则</button>
      <button class="btn gray" onclick="closeRuleManager()">关闭</button>
    </div>
  </div>
</div>

<script>
let jdyWidgets = [];
let dbColumns = [];
let primaryKey = 'id';

// 传输预览状态
let previewRows = [];      // 预览行数据（含 _row_id）
let previewColumns = [];   // 简道云字段 key
let previewTotal = 0;
let previewSourceTotal = 0;
let previewFilteredTotal = 0;
let excludedIds = new Set(); // 取消勾选的 _row_id
let page = 0;
const PAGE_SIZE = 50;
let currentTimeField = '';  // 当前勾选中的时间字段名
let currentSourceType = 'mysql';   // 当前数据源类型 mysql/oracle
let currentSourceSchemas = [];     // oracle 多 schema 列表
let currentIsMerge = false;        // 是否"全部合并"模式

const $ = id => document.getElementById(id);

let autoFillRules = [];

async function init() {
  await loadSources();
  await loadAutoSyncStatus();
  await loadJdyFields();
  await loadAutoFillRules();
  await loadSyncLog();
  if ($('syncLogAuto') && $('syncLogAuto').checked) {
    syncLogTimer = setInterval(loadSyncLog, SYNC_LOG_INTERVAL);
  }
  $('jdyAppId').textContent = '598d1c563788a36bcba8a193 / 6aa0bbef65115c860c3a7bfd';
}

async function loadAutoFillRules() {
  try {
    const r = await fetch('/api/auto-fill-rules').then(x => x.json());
    autoFillRules = r.rules || [];
  } catch (e) { autoFillRules = []; }
}

let currentSourceId = '';
let editingSourceId = '';

async function loadSources() {
  const r = await fetch('/api/sources').then(x => x.json());
  sourceList = r.sources;
  if (sourceList.length > 0) {
    $('source').value = sourceList[0].name;
    currentSourceId = sourceList[0].id;
    currentSourceType = sourceList[0].type || 'mysql';
    currentSourceSchemas = sourceList[0].schemas || [];
  }
  renderSourceDrop();
  await loadDatabases();
}

function filterSource() { renderSourceDrop(); }

function renderSourceDrop() {
  const dd = $('sourceDrop');
  const kw = $('source').value.toLowerCase();
  const filtered = sourceList.filter(s => s.name.toLowerCase().includes(kw));
  if (filtered.length === 0) {
    dd.innerHTML = '<div class="empty">无匹配</div>';
  } else {
    dd.innerHTML = filtered.map(s =>
      '<div class="opt" data-id="' + s.id + '" data-name="' + s.name + '">'
      + '<span>' + s.name + '</span>'
      + (s.user_added ? '<span class="del" data-del="' + s.id + '" title="删除">×</span>' : '')
      + '</div>').join('');
  }
  dd.style.display = 'block';
  dd.querySelectorAll('.opt').forEach(o => {
    o.onclick = () => {
      $('source').value = o.getAttribute('data-name');
      currentSourceId = o.getAttribute('data-id');
      const s = sourceList.find(x => x.id === currentSourceId);
      currentSourceType = s ? (s.type || 'mysql') : 'mysql';
      currentSourceSchemas = s ? (s.schemas || []) : [];
      dd.style.display = 'none';
      renderAutoSyncButtons();
      loadDatabases();
    };
  });
  dd.querySelectorAll('.del').forEach(d => {
    d.onclick = (e) => {
      e.stopPropagation();
      deleteSource(d.getAttribute('data-del'));
    };
  });
}

// ---------- 添加 / 删除 / 修改数据源 ----------
function openAddSource() {
  editingSourceId = '';
  $('srcType').value = 'mysql';
  $('srcName').value = '';
  $('srcHost').value = '';
  $('srcPort').value = '3306';
  $('srcUser').value = '';
  $('srcPassword').value = '';
  $('srcCharset').value = 'gbk';
  $('srcService').value = '';
  $('srcSchemas').value = '';
  $('srcInstantClient').value = '';
  $('srcMsg').textContent = '';
  toggleSourceForm();
  $('sourceModal').style.display = 'flex';
}

function closeAddSource() {
  $('sourceModal').style.display = 'none';
}

function openSourceManager() {
  const list = sourceList.map(s =>
    '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #eee;">'
    + '<span>' + s.name + ' <span style="color:#999;font-size:11px;">(' + s.id + ')</span></span>'
    + '<span><button class="btn mini" onclick="editSource(\'' + s.id + '\')">编辑</button> '
    + '<button class="btn mini red" onclick="deleteSource(\'' + s.id + '\')">删除</button></span>'
    + '</div>').join('');
  $('mgrList').innerHTML = list || '<div style="color:#999;">暂无数据源</div>';
  $('mgrModal').style.display = 'flex';
}

function closeSourceManager() {
  $('mgrModal').style.display = 'none';
}

async function editSource(id) {
  const s = await fetch('/api/sources/' + encodeURIComponent(id)).then(x => x.json());
  editingSourceId = id;
  $('srcType').value = s.type || 'mysql';
  $('srcName').value = s.name || '';
  $('srcHost').value = s.host || '';
  $('srcPort').value = s.port || (s.type === 'oracle' ? '1521' : '3306');
  $('srcUser').value = s.user || '';
  $('srcPassword').value = '';
  $('srcCharset').value = s.charset || 'gbk';
  $('srcService').value = s.service || '';
  $('srcSchemas').value = (s.schemas || []).join(',');
  $('srcInstantClient').value = s.instant_client || '';
  $('srcMsg').textContent = '';
  toggleSourceForm();
  closeSourceManager();
  $('sourceModal').style.display = 'flex';
}

function toggleSourceForm() {
  const isOracle = $('srcType').value === 'oracle';
  $('oracleFields').style.display = isOracle ? 'block' : 'none';
  $('srcCharsetRow').style.display = isOracle ? 'none' : 'block';
  if (!$('srcPort').value || $('srcPort').value === '3306' || $('srcPort').value === '1521') {
    $('srcPort').value = isOracle ? '1521' : '3306';
  }
}

function collectSourceForm() {
  const type = $('srcType').value;
  const body = {
    type: type,
    name: $('srcName').value.trim(),
    host: $('srcHost').value.trim(),
    port: parseInt($('srcPort').value) || 0,
    user: $('srcUser').value.trim(),
    password: $('srcPassword').value,
  };
  if (type === 'mysql') {
    body.charset = $('srcCharset').value.trim();
  } else {
    body.service = $('srcService').value.trim();
    body.instant_client = $('srcInstantClient').value.trim();
    body.schemas = $('srcSchemas').value.split(',').map(x => x.trim()).filter(x => x);
  }
  return body;
}

async function testSource() {
  const msg = $('srcMsg');
  const body = collectSourceForm();
  if (!body.name || !body.host || !body.user) { msg.textContent = '请填写名称、主机、用户名'; msg.className = 'msg err'; return; }
  msg.textContent = '正在测试连接…';
  msg.className = 'msg';
  const r = await fetch('/api/sources/test', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  }).then(x => x.json());
  msg.textContent = r.message;
  msg.className = r.ok ? 'msg ok' : 'msg err';
}

async function saveSource() {
  const msg = $('srcMsg');
  const body = collectSourceForm();
  if (!body.name || !body.host || !body.user) { msg.textContent = '请填写名称、主机、用户名'; msg.className = 'msg err'; return; }
  const url = editingSourceId ? ('/api/sources/' + encodeURIComponent(editingSourceId)) : '/api/sources';
  const method = editingSourceId ? 'PUT' : 'POST';
  const resp = await fetch(url, {
    method: method,
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  });
  const r = await resp.json();
  if (!resp.ok) { msg.textContent = (r.detail || JSON.stringify(r)); msg.className = 'msg err'; return; }
  closeAddSource();
  currentSourceId = r.source.id;
  editingSourceId = '';
  await refreshSources();
  log((method === 'PUT' ? '已修改数据源：' : '已添加数据源：') + r.source.name);
}

async function deleteSource(id) {
  if (!confirm('确认删除该数据源？')) return;
  const resp = await fetch('/api/sources/' + encodeURIComponent(id), { method: 'DELETE' });
  const r = await resp.json();
  if (!resp.ok) { alert((r.detail || '删除失败')); return; }
  if (currentSourceId === id) currentSourceId = '';
  await refreshSources();
  if ($('mgrModal').style.display === 'flex') openSourceManager();
  log('已删除数据源：' + id);
}

async function refreshSources() {
  const r = await fetch('/api/sources').then(x => x.json());
  sourceList = r.sources;
  let cur = sourceList.find(x => x.id === currentSourceId);
  if (!cur) {
    cur = sourceList[0] || null;
    currentSourceId = cur ? cur.id : '';
  }
  if (cur) {
    $('source').value = cur.name;
    currentSourceType = cur.type || 'mysql';
    currentSourceSchemas = cur.schemas || [];
  } else {
    $('source').value = '';
  }
  renderSourceDrop();
  if (!currentSourceId) {
    dbList = []; $('db').value = ''; renderDrop('db', dbList, onPickDb);
    tableList = []; $('table').value = ''; renderDrop('table', tableList, onPickTable);
    dbColumns = []; $('dbFields').innerHTML = '';
    currentTimeField = ''; updateTimeFilterUI();
    return;
  }
  await loadDatabases();
}

async function loadDatabases() {
  if (!currentSourceId) { dbList = []; $('db').value = ''; renderDrop('db', dbList, onPickDb); return; }
  const r = await fetch('/api/databases?source=' + encodeURIComponent(currentSourceId)).then(x => x.json());
  dbList = r.databases || [];
  if (dbList.includes('dpt_product')) $('db').value = 'dpt_product';
  else if (dbList.length > 0) $('db').value = dbList[0];
  else $('db').value = '';
  renderDrop('db', dbList, onPickDb);
  await loadTables();
}

async function loadTables() {
  const db = $('db').value.trim();
  currentIsMerge = false;
  if (!db) { tableList = []; $('table').value = ''; renderDrop('table', tableList, onPickTable); return; }
  const r = await fetch('/api/tables?source=' + encodeURIComponent(currentSourceId) + '&database=' + encodeURIComponent(db)).then(x => x.json());
  tableList = r.tables;
  if (tableList.includes('coaching_class')) $('table').value = 'coaching_class';
  else if (tableList.length > 0) $('table').value = tableList[0];
  else $('table').value = '';
  renderDrop('table', tableList, onPickTable);
  await loadColumns();
}

async function loadColumns() {
  const db = $('db').value.trim(), table = $('table').value.trim();
  currentIsMerge = false;
  applyAutoDefaults();
  if (!db || !table) { dbColumns = []; $('dbFields').innerHTML = ''; currentTimeField = ''; updateTimeFilterUI(); return; }
  const r = await fetch('/api/columns?source=' + encodeURIComponent(currentSourceId) + '&database=' + encodeURIComponent(db) + '&table=' + encodeURIComponent(table)).then(x => x.json());
  dbColumns = r.columns;
  primaryKey = r.primary_key || 'id';
  const box = $('dbFields');
  box.innerHTML = '';
  r.columns.forEach(c => {
    const div = document.createElement('div');
    div.className = 'field-item';
    div.innerHTML = '<input type="checkbox" value="' + c.name + '" onchange="rebuildMapping()">'
      + '<span class="fname">' + c.name + '</span>'
      + '<span class="fmeta">' + c.type + (c.comment ? ' · ' + c.comment : '') + '</span>';
    box.appendChild(div);
  });
  currentTimeField = '';
  updateTimeFilterUI();
  await autoLoadMapping();
}

function renderDrop(id, items, onPick) {
  const el = $(id);
  const key = id === 'db' ? 'dbDrop' : 'tableDrop';
  const dd = $(key);

  } else {
    dd.innerHTML = filtered.map(x => {
      return '<div class="opt" data-v="' + x + '">' + x + '</div>';

  dd.style.display = 'block';
  dd.querySelectorAll('.opt').forEach(o => {
    o.onclick = () => { onPick(o.getAttribute('data-v')); dd.style.display = 'none'; };
  });
}

// 判断字段是否为时间类型（Oracle 的年份数字字段也视为时间字段）
function isTimeField(name) {
  const c = dbColumns.find(x => x.name === name);
  if (!c) return false;
  const t = (c.type || '').toLowerCase();
  if (t.includes('date') || t.includes('time')) return true;
  // Oracle 年份数字字段：如 BEGIN_YEAR（NUMBER 类型，但语义是年份）
  const n = name.toUpperCase();
  if (currentSourceType === 'oracle' && (n === 'BEGIN_YEAR' || n.endsWith('_YEAR'))) return true;
  return false;
}

// 判断时间字段是否为 Oracle 数字年份（只筛年）
function isYearField(name) {
  if (currentSourceType !== 'oracle') return false;
  const c = dbColumns.find(x => x.name === name);
  if (!c) return false;
  const t = (c.type || '').toLowerCase();
  if (t.includes('date') || t.includes('time')) return false;
  const n = name.toUpperCase();
  return n === 'BEGIN_YEAR' || n.endsWith('_YEAR');
}

// 生成年月日三级下拉；prefix='to' 时默认选中今天；yearOnly 只显示年
function buildDatePicker(prefix, yearOnly) {
  const now = new Date();
  const today = { y: now.getFullYear(), m: now.getMonth() + 1, d: now.getDate() };
  const isTo = prefix === 'to';
  let html = '<div class="two-col">';
  html += '<div><select id="' + prefix + '_y" onchange="onDateChange(\'' + prefix + '\')"><option value="">年</option>';
  for (let y = now.getFullYear() + 1; y >= 1990; y--) {
    const sel = isTo && y === today.y ? ' selected' : '';
    html += '<option value="' + y + '"' + sel + '>' + y + '</option>';
  }
  html += '</select></div>';
  if (!yearOnly) {
    html += '<div><select id="' + prefix + '_m" onchange="onDateChange(\'' + prefix + '\')"><option value="">月</option>';
    for (let m = 1; m <= 12; m++) {
      const sel = isTo && m === today.m ? ' selected' : '';
      html += '<option value="' + m + '"' + sel + '>' + m + '月</option>';
    }
    html += '</select></div>';
    html += '<div><select id="' + prefix + '_d"><option value="">日</option>';
    for (let d = 1; d <= 31; d++) {
      const sel = isTo && d === today.d ? ' selected' : '';
      html += '<option value="' + d + '"' + sel + '>' + d + '日</option>';
    }
    html += '</select></div>';
  }
  html += '</div>';
  return html;
}

}

// 智能默认映射：按字段名/类型猜测
function guessTarget(src) {
  const s = src.toLowerCase();
  if (isTimeField(src)) return '_widget_1788918827862';                 // 平台数据创建时间
  if (s.includes('number') || s.includes('code')) return '_widget_1788918827860'; // 项目编号
  if (s.includes('name')) return '_widget_1788918827861';                         // 项目名称
  return jdyWidgets.length ? jdyWidgets[0].name : '';
}

// 按字段名猜测转换规则（仅针对明确的模式）
function guessTransform(src) {
  const n = src.toUpperCase();
  if (n.indexOf('PLANNAME') >= 0) return 'batch_number';
  if (n.indexOf('AREANAME') >= 0) return 'city_name';
  return '';
}

function rebuildMapping() {
  const selected = getSelectedDbFields();
  const box = $('mappingList');
  box.innerHTML = '';
  const isFeixia = curSourceName() === '飞霞系统';
  const tOpts = '<option value="">无转换</option>'
    + '<option value="batch_number">提取批次号</option>'
    + '<option value="city_name">市名+考场</option>';
  selected.forEach(src => {
    const row = document.createElement('div');
    row.className = 'map-row';
    const opts = jdyWidgets.map(w =>
      '<option value="' + w.name + '">' + w.label + '</option>').join('');
    row.innerHTML = '<span style="flex:1;">' + src + '</span>'
      + '<span class="arrow">→</span>'
      + '<select class="target-sel">' + opts + '</select>'
      + (isFeixia ? '<select class="transform-sel" title="转换规则">' + tOpts + '</select>' : '');
    const sel = row.querySelector('.target-sel');
    const g = guessTarget(src);
    if (g) sel.value = g;
    if (isFeixia) {
      const tsel = row.querySelector('.transform-sel');
      const gt = guessTransform(src);
      if (gt) tsel.value = gt;
    }
    box.appendChild(row);
  });
  if (selected.length === 0) box.innerHTML = '<span style="color:#999;">请先在左侧勾选字段。</span>';
  updateTimeFilterUI();
}

// 选完数据源/库/表后，按已保存映射自动勾选字段并填充映射面板
async function autoLoadMapping() {
  const db = $('db').value.trim(), table = $('table').value.trim();
  if (!currentSourceId || !db || !table) return;
  let m = null;
  try {
    const r = await fetch('/api/mappings').then(x => x.json());
    m = (r.mappings || []).find(x =>
      x.source === currentSourceId && x.database === db && x.table === table && x.enabled !== false) || null;
  } catch (e) { m = null; }
  if (!m || !m.source_fields || !m.source_fields.length) return;
  if (!jdyWidgets.length) {
    try { await loadJdyFields(); } catch (e) {}
  }

  document.querySelectorAll('#dbFields .field-item input[type=checkbox]').forEach(cb => {
    cb.checked = m.source_fields.includes(cb.value);
  });
  rebuildMapping();
  const rows = [...document.querySelectorAll('#mappingList .map-row')];
  rows.forEach((r, i) => {
    if (m.target_fields && m.target_fields[i]) r.querySelector('.target-sel').value = m.target_fields[i];
    const t = r.querySelector('.transform-sel');
    if (t && m.transforms && m.transforms[i]) t.value = m.transforms[i];
  });
  if (m.platform_value) $('platformValue').value = m.platform_value;
  if (m.data_type_value) $('dataTypeValue').value = m.data_type_value;
  log('已按映射自动勾选字段：' + m.table);
}

function curSourceName() {
  const s = sourceList.find(x => x.id === currentSourceId);
  return s ? (s.name || '') : '';
}

function applyAutoDefaults() {
  const sname = curSourceName();
  const db = $('db').value.trim();
  const table = $('table').value.trim();
  const rule = autoFillRules.find(r => r.source_name === sname);
  $('platformValue').value = (rule && rule.platform) ? rule.platform : '';
  let dt = '';
  if (rule) {
    for (const d of (rule.data_types || [])) {
      if (d.match === db || d.match === table) { dt = d.value; break; }
    }
  }
  $('dataTypeValue').value = dt;
}

async function saveMapping() {
  const selected = getSelectedDbFields();
  if (selected.length === 0) { alert('请先在左侧勾选要映射的字段'); return; }
  const rows = [...document.querySelectorAll('#mappingList .map-row')];
  const targetFields = rows.map(r => r.querySelector('.target-sel').value);
  const transforms = rows.map(r => { const t = r.querySelector('.transform-sel'); return t ? t.value : ''; });
  const db = $('db').value.trim(), table = $('table').value.trim();
  if (!db || !table) { alert('请先选择数据库和表'); return; }
  const mappingId = currentSourceType === 'oracle'
    ? currentSourceId + '-' + db + '-' + table
    : currentSourceId + '-' + table;
  const body = {
    id: mappingId,
    source: currentSourceId,
    database: db,
    table: table,
    source_fields: selected,
    target_fields: targetFields,
    transforms: transforms,
    platform_value: $('platformValue').value.trim(),
    data_type_value: $('dataTypeValue').value.trim(),
    enabled: true
  };
  const resp = await fetch('/api/mappings', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  });
  const r = await resp.json();
  if (!resp.ok) { alert('保存失败：' + (r.detail || JSON.stringify(r))); return; }
  log('已保存映射：' + mappingId + '（表 ' + table + '）');
  alert('映射已保存：' + mappingId);
}

// 读取起始时间，返回 {date_from, date_to}（date_to 恒空；不选日=到月，不选月=到年）
function getDateRange() {
  function read(prefix) {
    const y = $(prefix + '_y') ? $(prefix + '_y').value : '';
    const m = $(prefix + '_m') ? $(prefix + '_m').value : '';
    const d = $(prefix + '_d') ? $(prefix + '_d').value : '';
    if (!y) return '';
    if (!m) return y;
    const mm = String(m).padStart(2, '0');
    if (!d) return y + '-' + mm;
    return y + '-' + mm + '-' + String(d).padStart(2, '0');
  }
  return { date_from: read('from'), date_to: '' };
}

async function previewData() {
  const db = $('db').value.trim(), table = $('table').value.trim();

// 传输前预览
async function previewTransfer() {
  const db = $('db').value.trim(), table = $('table').value.trim();
  const selected = getSelectedDbFields();
  const rows = [...document.querySelectorAll('#mappingList .map-row')];
  const targetFields = rows.map(r => r.querySelector('.target-sel').value);
  const transforms = rows.map(r => { const t = r.querySelector('.transform-sel'); return t ? t.value : ''; });
  const sourceFields = selected;

  if (selected.length === 0) { alert('请先在左侧勾选要传输的字段'); return; }

  const platform = $('platformValue').value.trim();
  const dataType = $('dataTypeValue').value.trim();
  const limit = parseInt($('limitNum').value) || 0;
  const timeField = currentTimeField;
  const { date_from, date_to } = getDateRange();

  $('btnTransfer').disabled = true;
  log('正在生成预览…');

  try {
    const body = {
      source: currentSourceId,
      database: db, table: table,
      source_fields: sourceFields, target_fields: targetFields,
      transforms: transforms,
      platform_value: platform, data_type_value: dataType, limit: limit,
      time_field: timeField,
      date_from: date_from, date_to: date_to
    };
    if (currentIsMerge && currentSourceSchemas.length > 1) {
      body.database = currentSourceSchemas[0];
      body.schemas = currentSourceSchemas;
    }
    const resp = await fetch('/api/transfer/preview', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
    const r = await resp.json();
    if (!resp.ok) { log('预览失败：' + JSON.stringify(r)); return; }

    previewRows = r.rows;
    previewColumns = r.columns;
    previewTotal = r.total;
    previewSourceTotal = r.source_total;
    previewFilteredTotal = r.filtered_total;
    excludedIds = new Set();
    page = 0;

    renderPreviewPanel();
    log('预览完成：源表总数据 ' + r.source_total + ' 条，筛选后 ' + r.filtered_total + ' 条，本次将传输 ' + r.total + ' 条');
  } catch (e) {
    log('预览出错：' + e.message);
  } finally {
    $('btnTransfer').disabled = false;
  }
}

function jdyLabel(key) {
  const w = jdyWidgets.find(x => x.name === key);
  return w ? w.label : key;
}

function renderPreviewPanel() {
  const box = $('jdyResult');
  const selectedCount = previewTotal - excludedIds.size;
  let html = '<div class="summary">'
    + '源表总数据 <b>' + previewSourceTotal + '</b> 条<br>'
    + '时间筛选后 <b>' + previewFilteredTotal + '</b> 条<br>'
    + '本次将传输 <b id="selCount">' + selectedCount + '</b> 条（已取消 <b id="exclCount">' + excludedIds.size + '</b> 条）'
    + '</div>';

  html += '<div class="two-col" style="margin-bottom:8px;">'
    + '<button class="btn gray" onclick="toggleAll(true)">全选</button>'
    + '<button class="btn gray" onclick="toggleAll(false)">全不选</button>'
    + '</div>';

  html += renderPreviewTable();
  html += renderPager();

  html += '<div style="margin-top:12px;">'
    + '<button class="btn green" onclick="confirmTransfer()">确认传输（' + selectedCount + ' 条）</button>'
    + '</div>';

  box.innerHTML = html;
}

function renderPreviewTable() {
  const start = page * PAGE_SIZE;
  const slice = previewRows.slice(start, start + PAGE_SIZE);
  let html = '<div class="preview-scroll"><table><tr><th class="checkbox-cell">'
    + '<input type="checkbox" id="chkAll" onchange="onPageAll(this)" checked></th><th>#</th>';
  previewColumns.forEach(c => { html += '<th>' + jdyLabel(c) + '</th>'; });
  html += '</tr>';

  slice.forEach((row, idx) => {
    const rid = row._row_id;
    const checked = !excludedIds.has(rid);
    html += '<tr><td class="checkbox-cell"><input type="checkbox" data-id="' + rid + '" '
      + (checked ? 'checked' : '') + ' onchange="onRowToggle(this)"></td>'
      + '<td>' + (start + idx + 1) + '</td>';
    previewColumns.forEach(c => {
      const v = row[c] === undefined || row[c] === null ? '' : String(row[c]);
      html += '<td title="' + v.replace(/"/g, '&quot;') + '">' + v + '</td>';
    });
    html += '</tr>';
  });
  html += '</table></div>';
  return html;
}

function renderPager() {
  const totalPages = Math.max(1, Math.ceil(previewRows.length / PAGE_SIZE));
  return '<div class="pager">'
    + '<button onclick="gotoPage(' + (page - 1) + ')" ' + (page <= 0 ? 'disabled' : '') + '>上一页</button>'
    + '<span>第 ' + (page + 1) + ' / ' + totalPages + ' 页（共 ' + previewRows.length + ' 行）</span>'
    + '<button onclick="gotoPage(' + (page + 1) + ')" ' + (page >= totalPages - 1 ? 'disabled' : '') + '>下一页</button>'
    + '</div>';
}

function onRowToggle(el) {
  const id = el.getAttribute('data-id');
  if (el.checked) excludedIds.delete(id); else excludedIds.add(id);
  updateCountDisplay();
}

function onPageAll(el) {
  const start = page * PAGE_SIZE;
  const slice = previewRows.slice(start, start + PAGE_SIZE);
  slice.forEach(row => {
    if (el.checked) excludedIds.delete(row._row_id);
    else excludedIds.add(row._row_id);
  });
  document.querySelectorAll('.preview-scroll input[type=checkbox][data-id]').forEach(c => c.checked = el.checked);
  updateCountDisplay();
}

function toggleAll(on) {
  if (on) excludedIds.clear();
  else previewRows.forEach(r => excludedIds.add(r._row_id));
  renderPreviewPanel();
}

function gotoPage(p) {
  const totalPages = Math.max(1, Math.ceil(previewRows.length / PAGE_SIZE));
  if (p < 0 || p >= totalPages) return;
  page = p;
  renderPreviewPanel();
}

function updateCountDisplay() {
  const sel = document.getElementById('selCount');
  const exc = document.getElementById('exclCount');
  if (sel) sel.textContent = previewTotal - excludedIds.size;
  if (exc) exc.textContent = excludedIds.size;
}

// 确认传输（真正写入）
async function confirmTransfer() {
  const db = $('db').value.trim(), table = $('table').value.trim();
  const selected = getSelectedDbFields();
  const rows = [...document.querySelectorAll('#mappingList .map-row')];
  const targetFields = rows.map(r => r.querySelector('.target-sel').value);
  const transforms = rows.map(r => { const t = r.querySelector('.transform-sel'); return t ? t.value : ''; });
  const sourceFields = selected;
  const platform = $('platformValue').value.trim();
  const dataType = $('dataTypeValue').value.trim();
  const limit = parseInt($('limitNum').value) || 0;
  const timeField = currentTimeField;
  const { date_from, date_to } = getDateRange();

  if (excludedIds.size > 0 && excludedIds.size >= previewTotal) {
    alert('已全部取消勾选，没有数据可传输'); return;
  }
  if (!confirm('确认传输 ' + (previewTotal - excludedIds.size) + ' 条数据到简道云？')) return;

  $('progress').style.display = 'block';
  $('progressBar').style.width = '5%';
  log('开始传输…');

  try {
    const body = {
      source: currentSourceId,
      database: db, table: table,
      source_fields: sourceFields, target_fields: targetFields,
      transforms: transforms,
      platform_value: platform, data_type_value: dataType, limit: limit,
      time_field: timeField,
      date_from: date_from, date_to: date_to,
      excluded_ids: [...excludedIds]
    };
    if (currentIsMerge && currentSourceSchemas.length > 1) {
      body.database = currentSourceSchemas[0];
      body.schemas = currentSourceSchemas;
    }
    const resp = await fetch('/api/transfer', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
    const r = await resp.json();
    $('progressBar').style.width = '100%';
    log(r.message + '\n' + (r.errors && r.errors.length ? '错误明细：\n' + r.errors.join('\n') : ''));
  } catch (e) {
    log('传输出错：' + e.message);
  } finally {
    setTimeout(() => { $('progress').style.display = 'none'; $('progressBar').style.width = '0'; }, 2000);
  }
}

// 查看简道云表单已有数据
let jdyPage = 0;
let jdyPageSize = 50;
let jdyStatsHtml = '';

async function viewJdyData() {
  jdyPage = 0;
  jdyStatsHtml = '';
  await loadJdyPage();
  loadJdyStats();
}

async function loadJdyPage() {
  const box = $('jdyResult');
  box.innerHTML = '<div class="hint">加载中…</div>';
  try {
    const skip = jdyPage * jdyPageSize;
    const r = await fetch('/api/jdy/preview?limit=' + jdyPageSize + '&skip=' + skip).then(x => x.json());
    let html = '<div id="jdyStatsBox" class="hint" style="margin-bottom:6px;">' + (jdyStatsHtml || '平台统计加载中…') + '</div>';
    html += '<div class="summary">简道云表单已有数据（第 ' + (jdyPage + 1) + ' 页，每页 ' + jdyPageSize + ' 条）</div>';
    html += '<div class="preview-scroll"><table><tr>';
    r.columns.forEach(c => { html += '<th>' + c + '</th>'; });
    html += '</tr>';
    r.rows.forEach(row => {
      html += '<tr>' + row.map(v => '<td title="' + String(v).replace(/"/g, '&quot;') + '">' + v + '</td>').join('') + '</tr>';
    });
    html += '</table></div>';
    const hasMore = r.rows.length >= jdyPageSize;
    html += '<div style="margin-top:8px;display:flex;gap:8px;align-items:center;">'
      + '<button class="btn mini" onclick="jdyPrevPage()"' + (jdyPage === 0 ? ' disabled' : '') + '>上一页</button>'
      + '<span style="font-size:13px;">第 ' + (jdyPage + 1) + ' 页</span>'
      + '<button class="btn mini" onclick="jdyNextPage()"' + (hasMore ? '' : ' disabled') + '>下一页</button>'
      + '</div>';
    box.innerHTML = html;
  } catch (e) {
    box.innerHTML = '<div class="hint">加载失败：' + e.message + '</div>';
  }
}

function jdyPrevPage() { if (jdyPage > 0) { jdyPage--; loadJdyPage(); } }
function jdyNextPage() { jdyPage++; loadJdyPage(); }

async function loadJdyStats() {
  try {
    const r = await fetch('/api/jdy/stats').then(x => x.json());
    const total = r.total || 0;
    const platforms = r.platforms || [];
    let html = '各平台数据条数（共 ' + total + ' 条）：';
    html += platforms.length === 0
      ? '暂无数据'
      : platforms.map(s => s.platform + ' <b>' + s.count + '</b> 条').join('　');
    jdyStatsHtml = html;
    const st = $('jdyStatsBox');
    if (st) st.innerHTML = html;
  } catch (e) {
    jdyStatsHtml = '平台统计加载失败：' + e.message;
    const st = $('jdyStatsBox');
    if (st) st.innerHTML = jdyStatsHtml;
  }
}

function log(msg) {
  const el = $('log');
  el.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
}

// ---------- 同步日志（sync.log） ----------
let syncLogTimer = null;
let syncLogData = { entries: [], lines: [], last_round: {}, newest_change: null };
let syncLogChangeKey = null;    // 上一次已知的最新变更标识
let syncLogInitialized = false; // 是否已完成首次加载（首次不提醒）
let syncLogAlerting = false;
let syncLogTitleTimer = null;
const SYNC_LOG_INTERVAL = 5000;

function syncLogFmtTime(t) { return t ? t.slice(11) : ''; }

async function loadSyncLog() {
  try {
    const r = await fetch('/api/sync/log?lines=100').then(x => x.json());
    syncLogData = r;
    const nc = r.newest_change;
    const key = nc ? (nc.time + '|' + nc.raw) : null;
    if (syncLogInitialized && key && key !== syncLogChangeKey) {
      triggerSyncLogAlert();
    }
    syncLogChangeKey = key;
    syncLogInitialized = true;
    renderSyncLog();
  } catch (e) { /* 单次失败忽略，下次轮询重试 */ }
}

function renderSyncLog() {
  const list = $('syncLogList');
  const hideIdle = $('syncLogHideIdle') && $('syncLogHideIdle').checked;
  const all = (syncLogData.entries || []).slice().reverse();   // 最新在上
  const shown = hideIdle ? all.filter(e => e.kind !== 'idle') : all;
  if (shown.length === 0) {
    list.innerHTML = '<div class="hint" style="padding:10px;">暂无记录</div>';
  } else {
    let html = '<table><tr><th style="width:72px;">时间</th><th style="width:160px;">数据源/映射</th>'
      + '<th style="width:64px;">类型</th><th>详情</th></tr>';
    shown.forEach(e => { html += '<tr>' + syncLogCells(e) + '</tr>'; });
    list.innerHTML = html + '</table>';
  }
  const lr = syncLogData.last_round || { created: 0, updated: 0, errors: 0 };
  const nc = syncLogData.newest_change;
  let html = '最近一轮：新增 <b style="color:#2f855a;">' + (lr.created || 0) + '</b>'
    + '　修改 <b style="color:#2b6cb0;">' + (lr.updated || 0) + '</b>';
  if ((lr.errors || 0) > 0) html += '　失败 <b style="color:#c53030;">' + lr.errors + '</b>';
  html += '　｜　';
  if (nc) {
    html += '<span style="color:#2f855a;">最近变更：' + esc(syncLogFmtTime(nc.time)) + ' '
      + esc(nc.mapping || '') + ' ' + esc(nc.text) + '</span>';
  } else {
    html += '<span style="color:#999;">窗口内无新增/修改</span>';
  }
  if (syncLogData.mtime) html += '　<span style="color:#999;">日志更新：' + esc(syncLogData.mtime) + '</span>';
  $('syncLogSummary').innerHTML = html;
  const rawEl = $('syncLogRaw');
  if (rawEl) rawEl.textContent = (syncLogData.lines || []).join('\n');
}

function syncLogCells(e) {
  const t = '<td>' + esc(syncLogFmtTime(e.time)) + '</td>';
  const m = '<td>' + esc(e.mapping || '') + '</td>';
  let label = '信息', color = '#718096';
  if (e.kind === 'result') {
    if (e.created || e.updated) { label = '变更'; color = '#2f855a'; }
    else { label = '完成'; color = '#a0aec0'; }
  } else if (e.kind === 'update') { label = '修改'; color = '#2b6cb0'; }
  else if (e.kind === 'error') { label = '错误'; color = '#c53030'; }
  else if (e.kind === 'reconcile') { label = '对账'; color = '#b7791f'; }
  else if (e.kind === 'idle') { label = '空闲'; color = '#cbd5e0'; }
  const k = '<td><span style="color:' + color + ';font-weight:600;">' + label + '</span></td>';
  let text = esc(e.text);
  if (e.kind === 'result' && (e.created || e.updated)) text = '<b style="color:#2f855a;">' + text + '</b>';
  else if (e.kind === 'error') text = '<span style="color:#c53030;">' + text + '</span>';
  return t + m + k + '<td>' + text + '</td>';
}

function triggerSyncLogAlert() {
  syncLogAlerting = true;
  const badge = $('syncLogBadge'); if (badge) badge.style.display = 'inline-block';
  const ack = $('syncLogAck'); if (ack) ack.style.display = 'inline-block';
  startSyncLogTitleFlash();
}

function startSyncLogTitleFlash() {
  if (syncLogTitleTimer) return;
  const base = '数据迁移工具';
  let on = false;
  syncLogTitleTimer = setInterval(() => {
    on = !on;
    document.title = on ? '【有新变更】数据迁移工具' : base;
  }, 1000);
}

function ackSyncLogAlert() {
  syncLogAlerting = false;
  if (syncLogTitleTimer) { clearInterval(syncLogTitleTimer); syncLogTitleTimer = null; }
  document.title = '数据迁移工具';
  const badge = $('syncLogBadge'); if (badge) badge.style.display = 'none';
  const ack = $('syncLogAck'); if (ack) ack.style.display = 'none';
}

function toggleSyncLogAuto() {
  const on = $('syncLogAuto').checked;
  if (on) {
    if (!syncLogTimer) syncLogTimer = setInterval(loadSyncLog, SYNC_LOG_INTERVAL);
    loadSyncLog();
  } else if (syncLogTimer) {
    clearInterval(syncLogTimer); syncLogTimer = null;
  }
}

// ---------- 映射管理 ----------
let mappingMgrData = [];

async function openMappingManager() {
  const r = await fetch('/api/mappings').then(x => x.json());
  mappingMgrData = r.mappings || [];
  renderMappingManager();
  $('mappingMgrModal').style.display = 'flex';
}

function closeMappingManager() {
  $('mappingMgrModal').style.display = 'none';
}

function renderMappingManager() {
  if (mappingMgrData.length === 0) {
    $('mappingMgrList').innerHTML = '<div style="color:#999;">暂无映射</div>';
    return;
  }
  $('mappingMgrList').innerHTML = mappingMgrData.map(m =>
    '<div style="padding:8px 0;border-bottom:1px solid #eee;">'
    + '<div><b>' + m.table + '</b> <span style="color:#999;font-size:11px;">(' + m.id + ')</span></div>'
    + '<div style="color:#666;font-size:12px;">源：' + m.source + ' / 库：' + (m.database || '—') + '　数据类型：' + (m.data_type_value || '—') + '</div>'
    + '<div style="margin-top:4px;">'
    + '<button class="btn mini" onclick="editMapping(\'' + m.id + '\')">编辑</button> '
    + '<button class="btn mini red" onclick="deleteMapping(\'' + m.id + '\')">删除</button>'
    + '</div></div>').join('');
}

async function editMapping(id) {
  const m = await fetch('/api/mappings/' + encodeURIComponent(id)).then(x => x.json());
  closeMappingManager();
  currentSourceId = m.source;
  const s = sourceList.find(x => x.id === m.source);
  if (s) { $('source').value = s.name; currentSourceType = s.type || 'mysql'; currentSourceSchemas = s.schemas || []; }
  await loadDatabases();
  $('db').value = m.database || '';
  await loadTables();
  $('table').value = m.table || '';
  await loadColumns();
  document.querySelectorAll('#dbFields .field-item input[type=checkbox]').forEach(cb => {
    cb.checked = (m.source_fields || []).includes(cb.value);
  });
  rebuildMapping();
  const rows = [...document.querySelectorAll('#mappingList .map-row')];
  rows.forEach((r, i) => {
    if (m.target_fields && m.target_fields[i]) r.querySelector('.target-sel').value = m.target_fields[i];
    const t = r.querySelector('.transform-sel');
    if (t && m.transforms && m.transforms[i]) t.value = m.transforms[i];
  });
  if (m.platform_value) $('platformValue').value = m.platform_value;
  if (m.data_type_value) $('dataTypeValue').value = m.data_type_value;
  log('已载入映射：' + id + '（核对后点「保存映射」覆盖）');
}

async function deleteMapping(id) {
  if (!confirm('确认删除该映射？')) return;
  const resp = await fetch('/api/mappings/' + encodeURIComponent(id), { method: 'DELETE' });
  const r = await resp.json();
  if (!resp.ok) { alert((r.detail || '删除失败')); return; }
  log('已删除映射：' + id);
  await openMappingManager();
}

// ---------- 规则管理 ----------
let ruleMgrData = [];

async function openRuleManager() {
  const r = await fetch('/api/auto-fill-rules').then(x => x.json());
  ruleMgrData = JSON.parse(JSON.stringify(r.rules || []));
  renderRuleManager();
  $('ruleMgrModal').style.display = 'flex';
}

function closeRuleManager() {
  $('ruleMgrModal').style.display = 'none';
}

function renderRuleManager() {
  if (ruleMgrData.length === 0) {
    $('ruleMgrList').innerHTML = '<div style="color:#999;">暂无规则</div>';
    return;
  }
  $('ruleMgrList').innerHTML = ruleMgrData.map((rule, ri) => {
    const dtRows = (rule.data_types || []).map((d, di) =>
      '<div style="display:flex;gap:6px;margin:4px 0;align-items:center;">'
      + '<input type="text" value="' + esc(d.match) + '" onchange="ruleMgrData[' + ri + '].data_types[' + di + '].match=this.value" placeholder="匹配 库/表">'
      + '<input type="text" value="' + esc(d.value) + '" onchange="ruleMgrData[' + ri + '].data_types[' + di + '].value=this.value" placeholder="数据类型">'
      + '<button class="btn mini red" onclick="ruleMgrData[' + ri + '].data_types.splice(' + di + ',1);renderRuleManager()">删</button>'
      + '</div>').join('');
    return '<div style="padding:8px 0;border-bottom:1px solid #eee;">'
      + '<div style="display:flex;gap:6px;align-items:center;margin-bottom:4px;">'
      + '<input type="text" value="' + esc(rule.source_name) + '" onchange="ruleMgrData[' + ri + '].source_name=this.value" style="flex:1;" placeholder="数据源名">'
      + '<input type="text" value="' + esc(rule.platform) + '" onchange="ruleMgrData[' + ri + '].platform=this.value" style="flex:1;" placeholder="平台">'
      + '</div>'
      + dtRows
      + '<button class="btn mini" onclick="ruleMgrData[' + ri + '].data_types.push({match:\'\',value:\'\'});renderRuleManager()">+ 添加数据类型规则</button>'
      + '</div>';
  }).join('')
    + '<button class="btn mini" style="margin-top:6px;" onclick="ruleMgrData.push({source_name:\'\',platform:\'\',data_types:[]});renderRuleManager()">+ 添加数据源规则</button>';
}

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

async function saveRules() {
  const resp = await fetch('/api/auto-fill-rules', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(ruleMgrData)
  });
  const r = await resp.json();
  if (!resp.ok) { alert('保存失败：' + (r.detail || JSON.stringify(r))); return; }
  autoFillRules = ruleMgrData;
  closeRuleManager();
  log('规则已保存');
}

// ---------- 自动同步开关（单源 / 全部） ----------
let autoSyncState = { all: false, sources: {} };

async function loadAutoSyncStatus() {
  try {
    const r = await fetch('/api/sync/auto/status').then(x => x.json());
    autoSyncState = r;
  } catch (e) {
    autoSyncState = { all: false, sources: {} };
  }
  renderAutoSyncButtons();
}

function renderAutoSyncButtons() {
  const singleOn = !!(autoSyncState.sources && autoSyncState.sources[currentSourceId]);
  const allOn = !!autoSyncState.all;
  const b1 = $('btnAutoSingle'), b2 = $('btnAutoAll');
  if (b1) {
    b1.textContent = singleOn ? '单源暂停' : '单源同步';
    b1.className = 'btn ' + (singleOn ? 'red' : 'green');
  }
  if (b2) {
    b2.textContent = allOn ? '全部暂停' : '全部同步';
    b2.className = 'btn ' + (allOn ? 'red' : 'green');
  }
}

async function toggleAutoSync(mode) {
  const willOn = mode === 'all' ? !autoSyncState.all : !(autoSyncState.sources && autoSyncState.sources[currentSourceId]);

  if (willOn) {
    const h = new Date().getHours();
    if (h >= 20 || h < 8) {
      alert('不在同步时间范围内（同步时间：08:00 ~ 20:00）');
      return;
    }
    let mappings = [];
    try {
      const r = await fetch('/api/mappings').then(x => x.json());
      mappings = (r.mappings || []).filter(m => m.enabled !== false);
    } catch (e) { mappings = []; }
    if (mode === 'single') {
      if (!mappings.some(m => m.source === currentSourceId)) {
        alert('当前数据源还没有保存映射，请先勾选字段并点「保存映射」后再同步');
        return;
      }
    } else {
      if (mappings.length === 0) {
        alert('还没有保存任何映射，请先保存映射后再同步');
        return;
      }
    }
  }

  const body = mode === 'all' ? { mode: 'all' } : { mode: 'single', source: currentSourceId };
  const b1 = $('btnAutoSingle'), b2 = $('btnAutoAll');
  if (willOn) {
    b1.disabled = true; b2.disabled = true;
    log((mode === 'all' ? '开启全部自动同步' : '开启「' + currentSourceId + '」自动同步') + '，正在立即同步一次…（首次对账可能较慢）');
  }
  try {
    const resp = await fetch('/api/sync/auto/toggle', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const r = await resp.json();
    if (!resp.ok) { alert('操作失败：' + (r.detail || JSON.stringify(r))); return; }
    autoSyncState = r;
    renderAutoSyncButtons();
    const name = mode === 'all' ? '全部数据源' : '「' + currentSourceId + '」';
    if (r.turned_on) {
      let created = 0, updated = 0, errors = 0, reconciled = 0, first = false;
      (Array.isArray(r.synced) ? r.synced : [r.synced]).forEach(x => {
        if (!x) return;
        if (x.error) { errors++; }
        else {
          created += (x.created || 0);
          updated += (x.updated || 0);
          if (x.first_sync) { first = true; reconciled += (x.reconciled || 0); }
        }
      });
      let msg = name + '已开启自动同步';
      if (first) { msg += '，首次对账：接管 ' + reconciled + '，新增 ' + created; }
      else { msg += '，本次同步：新增 ' + created + '，修改 ' + updated; }
      if (errors) { msg += '，失败 ' + errors; }
      log(msg);
    } else {
      log('已暂停 ' + name + ' 自动同步');
    }
  } catch (e) {
    alert('操作失败：' + e.message);
  } finally {
    b1.disabled = false; b2.disabled = false;
  }
}

async function resetSyncState() {
  const db = $('db').value.trim(), table = $('table').value.trim();
  if (!db || !table) { alert('请先选择数据库和表'); return; }
  const mappingId = currentSourceType === 'oracle'
    ? currentSourceId + '-' + db + '-' + table
    : currentSourceId + '-' + table;
  if (!confirm('确认重置「' + table + '」的同步状态？\n重置后下次同步会重新对账，并把数据全量写入简道云。')) return;
  try {
    const resp = await fetch('/api/sync/reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mapping_id: mappingId })
    });
    const r = await resp.json();
    if (!resp.ok) { alert('重置失败：' + (r.detail || JSON.stringify(r))); return; }
    if (r.existed) {
      log('已重置「' + table + '」的同步状态（下次同步将重新对账）');
      alert('已重置「' + table + '」的同步状态');
    } else {
      log('「' + table + '」本来就没有同步状态，无需重置');
      alert('「' + table + '」当前没有同步状态（未同步过），无需重置');
    }
  } catch (e) {
    alert('重置失败：' + e.message);
  }
}
